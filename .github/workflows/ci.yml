name: C builds and tests
on:
  push:
  pull_request:
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential python3 libreadline-dev
      - name: Build
        run: make core
      - name: Test
        run: make test
  graphics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential git python3 libreadline-dev libx11-dev libxext-dev libbsd-dev zlib1g-dev
      - name: Build game and libraries
        run: make
