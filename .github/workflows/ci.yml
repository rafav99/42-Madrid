name: 42 Madrid build
on:
  push:
  pull_request:
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential git python3 libreadline-dev
      - name: Build non-graphical projects
        run: make core
      - name: Test reconstructed code
        run: make test
  graphical-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential git python3 libreadline-dev libx11-dev libxext-dev libbsd-dev zlib1g-dev
      - name: Compile so_long and shared libraries
        run: make all
